# 通用配置。敏感项（数据库口令、JWT 密钥、管理员口令哈希）一律从环境变量读取且没有默认值：
# 缺任何一项应用都会启动失败，避免带着弱口令/空口令悄悄上线。
# 本地开发请用 dev profile（application-dev.yml），生产镜像固定使用 prod。
server:
  port: 8080
  # 跑在宿主机 Nginx 后面：信任 X-Forwarded-* 才能拿到真实访客 IP（登录限流按 IP 计）
  forward-headers-strategy: native
  shutdown: graceful

spring:
  application:
    name: blog-backend
  datasource:
    url: ${BLOG_DB_URL}
    username: ${BLOG_DB_USERNAME}
    password: ${BLOG_DB_PASSWORD}
  servlet:
    multipart:
      # 掘金导出的单篇 Markdown 很少超过 1MB，5MB 足够；总量限制配合“单次最多 200 个文件”
      max-file-size: 5MB
      max-request-size: 60MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    # 时间统一输出 ISO 字符串而不是时间戳数字，前端直接 new Date() 解析
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        # 只暴露 health，供容器 HEALTHCHECK 使用，不暴露 env/beans 等敏感端点
        include: health
  endpoint:
    health:
      show-details: never

blog:
  admin:
    username: ${BLOG_ADMIN_USERNAME}
    password-hash: ${BLOG_ADMIN_PASSWORD_HASH}
  jwt:
    secret: ${BLOG_JWT_SECRET}
    ttl: 12h
  cookie:
    name: blog_token
    # 线上全站 HTTPS，必须为 true；仅 dev profile 关闭（本地 http://localhost）
    secure: true
  translation:
    enabled: ${BLOG_TRANSLATION_ENABLED:false}
    base-url: ${BLOG_TRANSLATION_BASE_URL:https://api.openai.com/v1}
    api-key: ${BLOG_TRANSLATION_API_KEY:}
    model: ${BLOG_TRANSLATION_MODEL:gpt-4o-mini}
    batch-size: ${BLOG_TRANSLATION_BATCH_SIZE:2}
